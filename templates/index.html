<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перспектива Инжиниринг гарантийный сервис</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=9540">
    <script src="/static/app.js?v=9413"></script>
</head>
<body>
    <div class="app">
        <main class="main">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <div id="pageTitle" class="clickable-title title-stack">
                        <span class="title-line title-primary">
                            <span id="jkName" onclick="onTitleClick()">Перспектива</span>
                        </span>
                        <span class="title-line title-secondary" id="titleSecondary">− инжиниринг −</span>
                        <div class="header-sub" id="pageSubtitle"></div>
                    </div>
                    <!-- Mobile status filter dropdown -->
                    <select id="mobileStatusFilter" class="mobile-dropdown-filter" onchange="setAccessFilter(this.value)">
                        <option value="">Все</option>
                        <option value="defects">С замеч.</option>
                        <option value="call">Вызов</option>
                        <option value="owner_accepted">Принята</option>
                        <option value="complex">Сложные</option>
                        <option value="no_access">Нет доступа</option>
                    </select>
                </div>
                <div class="header-center">
                    <!-- Section and Category filters + Search (center-left) -->
                    <div class="header-filters" id="headerFilters" style="display:none;">
                        <div class="section-filter-wrapper" id="sectionFilterWrapper" style="display:none;">
                            <button type="button" class="section-filter-btn select" id="filterBtn" onclick="toggleFilterDropdown(event)">
                                <span id="filterBtnText">Все секции</span>
                                <span class="dropdown-arrow">▾</span>
                            </button>
                            <div class="multi-select-dropdown" id="filterDropdown">
                                <div id="filterOptions"></div>
                            </div>
                        </div>
                        <div class="section-filter-wrapper" id="categoryFilterWrapper">
                            <button type="button" class="section-filter-btn select" id="categoryFilterBtn" onclick="toggleCategoryDropdown(event)">
                                <span id="categoryFilterBtnText">Все категории</span>
                                <span class="dropdown-arrow">▾</span>
                            </button>
                            <div class="multi-select-dropdown" id="categoryDropdown">
                                <div id="categoryOptions"></div>
                            </div>
                        </div>
                    </div>
                    <!-- Search row -->
                    <div class="toolbar-search" id="toolbarSearch" style="display:none;">
                        <input type="text" id="searchApt" class="input search-apt" placeholder="Например 1,3-5,10" oninput="debouncedLoad()">
                    </div>
                </div>
                <div class="header-right">
                    <!-- Filter row (pills) -->
                    <div class="toolbar-filters" id="toolbarFilters" style="display:none;">
                        <select id="defectCategoryFilter" onchange="loadApartments()" class="select" style="display:none;">
                            <option value="">Все категории</option>
                        </select>
                        <div class="pills" id="statusPills">
                            <button class="pill pill-sort" id="sortByDefectsBtn" onclick="toggleApartmentSort()">Сорт</button>
                            <button class="pill" data-filter="defects" onclick="setAccessFilter('defects')">С замеч.</button>
                            <button class="pill" data-filter="call" onclick="setAccessFilter('call')">Вызов</button>
                            <button class="pill" data-filter="owner_accepted" onclick="setAccessFilter('owner_accepted')">Принята</button>
                            <button class="pill" data-filter="complex" onclick="setAccessFilter('complex')">Сложные</button>
                            <button class="pill" data-filter="no_access" onclick="setAccessFilter('no_access')">Нет доступа</button>
                            <button class="pill pill-stats" onclick="showStatsModal()">Статистика</button>
                        </div>
                    </div>
                    <!-- Apartment status buttons -->
                    <div class="toolbar-status" id="toolbarStatus" style="display:none;">
                        <button class="status-item" data-status="owner_accepted" onclick="setStatus('owner_accepted')">
                            <span>Принята</span>
                        </button>
                        <button class="status-item" data-status="call" onclick="setStatus('call')">
                            <span>Вызов</span>
                    </button>
                    <button class="status-item" data-status="in_progress" onclick="setStatus('in_progress')">
                        <span>В работе</span>
                    </button>
                    <button class="status-item" data-status="by_phone" onclick="setStatus('by_phone')">
                        <span>Доступ по звонку</span>
                    </button>
                    <button class="status-item" data-status="no_access" onclick="setStatus('no_access')">
                        <span>Нет доступа</span>
                    </button>
                        <button class="status-item" data-status="complex" onclick="setStatus('complex')">
                            <span>Сложные</span>
                        </button>
                    </div>
                </div>
            </header>
            
            <!-- Mobile filter indicator -->
            <div class="mobile-filter-indicator" id="mobileFilterIndicator">Все</div>
            
            <!-- Mobile filter buttons -->
            <div class="mobile-filter-buttons" id="mobileFilterButtons">
                <button class="mobile-filter-btn active" data-filter="">Все</button>
                <button class="mobile-filter-btn" data-filter="defects">С замеч.</button>
                <button class="mobile-filter-btn" data-filter="call">Вызов</button>
                <button class="mobile-filter-btn" data-filter="owner_accepted">Принята</button>
                <button class="mobile-filter-btn" data-filter="complex">Сложные</button>
                <button class="mobile-filter-btn" data-filter="no_access">Нет доступа</button>
            </div>

            <!-- Complexes -->
            <section id="tab-complexes" class="tab-panel active">
                <div id="complexesList" class="cards-grid"></div>
            </section>

            <!-- Create Complex -->
            <section id="tab-create-complex" class="tab-panel">
                <div class="create-complex-container">
                    <form id="createComplexForm" class="form create-complex-form">
                        <div class="form-header">
                            <h2>Новый комплекс</h2>
                        </div>
                        <div class="form-field">
                            <label>Название комплекса</label>
                            <input type="text" id="complexName" placeholder="Например: ЖК Дубровка">
                        </div>
                        <div class="form-field">
                            <label>Адрес ЖК</label>
                            <input type="text" id="complexAddress" placeholder="Например: ул. Ленина, 1">
                        </div>
                        <div class="form-field">
                            <label>Тип недвижимости</label>
                            <select id="complexType" class="select">
                                <option value="квартиры">Квартиры</option>
                                <option value="апартаменты">Апартаменты</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Дата ввода в эксплуатацию</label>
                            <input type="date" id="commissioningDate">
                        </div>
                        <div class="form-section">
                            <div class="form-section-header">
                                <span>Корпуса и секции</span>
                            </div>
                            <div id="buildingsContainer"></div>
                            <button type="button" class="btn btn-secondary btn-sm add-building-btn" onclick="addBuildingRow()">+ Добавить корпус</button>
                        </div>
                        <div class="form-footer">
                            <button type="button" class="btn" onclick="goHome()">Отмена</button>
                            <button type="submit" class="btn btn-primary">Создать комплекс</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Complex Detail -->
            <section id="tab-complex-detail" class="tab-panel">
                <div class="complex-detail-toolbar">
                </div>

                <div class="complex-detail-content">
                    <div class="complex-detail-main">
                        <div id="apartmentsContainer" class="sections-grid"></div>
                    </div>
                </div>
            </section>

            <!-- Apartment Detail -->
            <section id="tab-apartment-detail" class="tab-panel">
                <div class="detail-grid">
                    <div class="detail-content">
                        <div class="panel" id="phoneBlock" style="display:none;">
                            <div class="phone-panel">
                                <label>Телефон</label>
                                <div class="phone-row">
                                    <input type="tel" id="phoneInput" class="input" placeholder="+7 (999) 123-45-67">
                                    <button class="btn btn-primary" onclick="savePhone()">Сохранить</button>
                                    <button class="btn btn-danger" onclick="deletePhone()">Удалить</button>
                                </div>
                            </div>
                        </div>
                        <div class="panel" id="commentBlock" style="display:none;">
                            <div class="phone-panel">
                                <label>Комментарий</label>
                                <div class="phone-row">
                                    <input type="text" id="complexCommentInput" class="input" placeholder="Причина повышенной сложности">
                                    <button class="btn btn-primary" onclick="saveComment()">Сохранить</button>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header">
                                <span class="panel-title">Замечания</span>
                                <div>
                                    <button class="btn btn-sm" onclick="showAddDefectForm()">Добавить</button>
                                    <button class="btn btn-sm" onclick="printDefects()">Печать</button>
                                </div>
                            </div>
                            <div id="defectsList"></div>
                        </div>
                    </div>

                    <div class="detail-main"></div>
                </div>
            </section>

            <!-- Add Defect -->
            <section id="tab-add-defect" class="tab-panel">
                <form id="addDefectForm" class="form defect-form">
                    <div class="form-header defect-form-header">
                        <div>
                            <h2>Новое замечание</h2>
                            <p>Заполните строку замечания и рабочие параметры для дальнейшей отработки.</p>
                        </div>
                    </div>

                    <div class="defect-form-section">
                        <div class="defect-form-section-title">Основа</div>
                        <div class="form-grid form-grid-3">
                            <div class="form-field">
                                <label>Категория</label>
                                <select id="defectCategory" required><option value="">Выберите</option></select>
                            </div>
                            <div class="form-field" id="windowGroup" style="display:none;">
                                <label>Номер окна</label>
                                <input type="number" id="windowNumber" min="1">
                            </div>
                            <div class="form-field">
                                <label>Этап замечания</label>
                                <select id="defectStatus" required>
                                    <option value="recorded">Зафиксировано с собственником</option>
                                    <option value="assigned">Назначено подрядчику</option>
                                    <option value="in_progress">В работе</option>
                                    <option value="ready_for_acceptance">Готово к сдаче</option>
                                    <option value="accepted">Сдано</option>
                                    <option value="cancelled">Снято</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-field" id="templatesGroup" style="display:none;">
                            <label>Шаблоны</label>
                            <div id="templatesList" class="chips"></div>
                        </div>
                        <div class="form-field form-field-lg">
                            <label>Замечание</label>
                            <textarea id="defectDescription" rows="4" required placeholder="Опишите замечание понятной рабочей формулировкой"></textarea>
                        </div>
                    </div>

                    <div class="defect-form-section">
                        <div class="defect-form-section-title">Ресурсы</div>
                        <div class="form-grid form-grid-3">
                            <div class="form-field">
                                <label>Вид/Ал. номер</label>
                                <input type="text" id="defectVariantNumber" placeholder="061">
                            </div>
                            <div class="form-field">
                                <label>Проект</label>
                                <input type="text" id="defectProjectName" placeholder="Проект / узел">
                            </div>
                        </div>
                        <div class="form-grid form-grid-3">
                            <div class="form-field">
                                <label>Стоимость</label>
                                <input type="text" id="defectCostAmount" placeholder="0">
                            </div>
                            <div class="form-field">
                                <label>Затраты на работу</label>
                                <input type="text" id="defectLaborCost" placeholder="0">
                            </div>
                            <div class="form-field">
                                <label>Комментарий</label>
                                <input type="text" id="defectCommentText" placeholder="Примечание">
                            </div>
                        </div>
                    </div>

                    <div class="defect-form-section">
                        <div class="defect-form-section-title">Исполнение</div>
                        <div class="form-grid form-grid-2">
                            <div class="form-field">
                                <label>Ответственный подрядчик</label>
                                <div class="contractor-row">
                                    <select id="defectContractorId" class="select">
                                        <option value="">Не назначен</option>
                                    </select>
                                    <button type="button" class="btn btn-secondary" onclick="addContractorPrompt('create')">Новый подрядчик</button>
                                </div>
                            </div>
                            <div class="form-field">
                                <label>Срок</label>
                                <input type="date" id="defectDeadline">
                            </div>
                        </div>
                    </div>

                    <div class="defect-form-section">
                        <div class="defect-form-section-title">Фото</div>
                        <div class="form-field">
                            <div class="upload-zone" id="fileUploadArea">
                                <input type="file" id="defectPhotos" multiple accept="image/*" hidden>
                                Перетащите фото или нажмите для выбора
                            </div>
                            <div id="previewGrid" class="previews"></div>
                        </div>
                    </div>
                    <div class="form-footer">
                        <button type="button" class="btn" onclick="backToApartment()">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <div id="photoModal" class="modal">
        <div class="modal-content photo-modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <button id="photoModalPrev" class="photo-modal-nav photo-modal-prev" type="button" onclick="changePhoto(-1)">‹</button>
            <div class="photo-modal-stage">
                <img id="modalImg" src="" alt="">
                <div id="photoModalCounter" class="photo-modal-counter"></div>
            </div>
            <button id="photoModalNext" class="photo-modal-nav photo-modal-next" type="button" onclick="changePhoto(1)">›</button>
        </div>
    </div>

    <div id="commentsModal" class="modal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3>Комментарии</h3>
                <button class="modal-close" onclick="closeComments()">×</button>
            </div>
            <div class="modal-body" id="commentsBody"></div>
            <div class="modal-footer">
                <input type="text" id="commentInput" placeholder="Комментарий...">
                <button class="btn btn-primary btn-sm" onclick="submitComment()">→</button>
            </div>
        </div>
    </div>

    <div id="defectCommentsModal" class="modal">
        <div class="modal-content modal-sm defect-comments-modal">
            <div class="modal-header">
                <h3>Комментарии замечания</h3>
                <button class="modal-close" onclick="closeDefectComments()">×</button>
            </div>
            <div class="modal-body defect-comments-body" id="defectCommentsBody"></div>
            <div class="modal-footer defect-comments-footer">
                <textarea id="defectCommentInput" placeholder="Напишите комментарий"></textarea>
                <button class="btn btn-primary btn-sm" onclick="submitDefectComment()">Сохранить</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Stats Modal -->
    <div id="statsModal" class="modal stats-modal" onclick="closeStatsModal(event)">
        <div class="modal-content stats-popover" onclick="event.stopPropagation()">
            <div class="modal-body" id="statsBody"></div>
        </div>
    </div>
</body>
</html>
