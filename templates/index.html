<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приемка квартир</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=9532">
    <script src="/static/app.js?v=9410"></script>
</head>
<body>
    <div class="app">
        <main class="main">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <div id="pageTitle" class="clickable-title title-stack">
                        <span class="title-line title-primary">
                            <span id="jkName" onclick="onTitleClick()">Перспектива</span>
                        </span>
                        <span class="title-line title-secondary" id="titleSecondary">− инжиниринг −</span>
                        <div class="header-sub" id="pageSubtitle"></div>
                    </div>
                </div>
                <div class="header-center">
                    <!-- Section and Category filters + Search (center-left) -->
                    <div class="header-filters" id="headerFilters" style="display:none;">
                        <span class="section-filter-wrapper" id="sectionFilterWrapper" style="display:none;">
                            <button type="button" class="section-filter-btn select" id="filterBtn" onclick="toggleFilterDropdown(event)">
                                <span id="filterBtnText">Все секции</span>
                                <span class="dropdown-arrow">▾</span>
                            </button>
                            <div class="multi-select-dropdown" id="filterDropdown">
                                <div id="filterOptions"></div>
                            </div>
                        </span>
                        <span class="section-filter-wrapper" id="categoryFilterWrapper">
                            <button type="button" class="section-filter-btn select" id="categoryFilterBtn" onclick="toggleCategoryDropdown(event)">
                                <span id="categoryFilterBtnText">Все категории</span>
                                <span class="dropdown-arrow">▾</span>
                            </button>
                            <div class="multi-select-dropdown" id="categoryDropdown">
                                <div id="categoryOptions"></div>
                            </div>
                        </span>
                    </div>
                    <!-- Search row -->
                    <div class="toolbar-search" id="toolbarSearch" style="display:none;">
                        <input type="text" id="searchApt" class="input search-apt" placeholder="Например 1,3-5,10" oninput="debouncedLoad()">
                    </div>
                </div>
                <div class="header-right">
                    <!-- Filter dropdown -->
                    <div class="toolbar-filters" id="toolbarFilters" style="display:none;">
                        <div class="filter-dropdown-wrapper">
                            <button class="filter-dropdown-btn" onclick="toggleFilterDropdown()">
                                <span id="filterDropdownText">Все</span>
                                <span class="dropdown-arrow">▾</span>
                            </button>
                            <div class="filter-dropdown-menu" id="filterDropdownMenu">
                                <div class="filter-dropdown-item active" data-filter="" onclick="setFilter(this, '')">Все</div>
                                <div class="filter-dropdown-item" data-filter="defects" onclick="setFilter(this, 'defects')">С замеч.</div>
                                <div class="filter-dropdown-item" data-filter="call" onclick="setFilter(this, 'call')">Вызов</div>
                                <div class="filter-dropdown-item" data-filter="owner_accepted" onclick="setFilter(this, 'owner_accepted')">Принята</div>
                                <div class="filter-dropdown-item" data-filter="complex" onclick="setFilter(this, 'complex')">Сложные</div>
                                <div class="filter-dropdown-item" data-filter="no_access" onclick="setFilter(this, 'no_access')">Нет доступа</div>
                            </div>
                        </div>
                    </div>
                    <!-- Apartment status buttons -->
                    <div class="toolbar-status" id="toolbarStatus" style="display:none;">
                        <button class="status-item" data-status="owner_accepted" onclick="setStatus('owner_accepted')">
                            <span>Принята</span>
                        </button>
                        <button class="status-item" data-status="call" onclick="setStatus('call')">
                            <span>Пригласить</span>
                    </button>
                    <button class="status-item" data-status="in_progress" onclick="setStatus('in_progress')">
                        <span>В работе</span>
                    </button>
                    <button class="status-item" data-status="by_phone" onclick="setStatus('by_phone')">
                        <span>Доступ по звонку</span>
                    </button>
                    <button class="status-item" data-status="no_access" onclick="setStatus('no_access')">
                        <span>Нет доступа</span>
                    </button>
                    <button class="status-item" data-status="complex" onclick="setStatus('complex')">
                        <span>Особое внимание</span>
                    </button>
                </div>
            </header>

            <!-- Complexes -->
            <section id="tab-complexes" class="tab-panel active">
                <div id="complexesList" class="cards-grid"></div>
            </section>

            <!-- Create Complex -->
            <section id="tab-create-complex" class="tab-panel">
                <div class="form">
                    <div class="form-field">
                        <label>Название комплекса</label>
                        <input type="text" id="complexName" placeholder="Например: ЖК Дубровка">
                    </div>
                    <div class="form-field">
                        <label>Тип недвижимости</label>
                        <select id="complexType" class="select">
                            <option value="квартиры">Квартиры</option>
                            <option value="апартаменты">Апартаменты</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label>Дата ввода в эксплуатацию</label>
                        <input type="date" id="commissioningDate">
                    </div>
                    <div class="form-field">
                        <label>Гарантия инженерные сети (3 года)</label>
                        <input type="date" id="warranty3Date">
                    </div>
                    <div class="form-field">
                        <label>Гарантия общие (5 лет)</label>
                        <input type="date" id="warranty5Date">
                    </div>
                    <div class="form-section">
                        <div class="form-section-header">
                            <span>Корпуса и секции</span>
                            <button type="button" class="btn-link" onclick="addBuildingRow()">+ Добавить корпус</button>
                        </div>
                        <div id="buildingsContainer"></div>
                    </div>
                    <div class="form-footer">
                        <button type="button" class="btn" onclick="showTab('complexes')">Отмена</button>
                        <button type="button" class="btn btn-primary" onclick="submitComplexForm()">Создать комплекс</button>
                    </div>
                </div>

                <div id="statsPanel" class="stats-panel">
                    <div class="stats-title">Статистика</div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <span class="stat-label">Всего</span>
                            <span class="stat-value" id="statTotal">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Без замечаний</span>
                            <span class="stat-value" id="statAvailable">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Принято</span>
                            <span class="stat-value" id="statAccepted">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Вызов</span>
                            <span class="stat-value" id="statCall">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Нет доступа</span>
                            <span class="stat-value" id="statNoAccess">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">С замеч.</span>
                            <span class="stat-value" id="statDefects">0</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Complex Detail -->
            <section id="tab-complex-detail" class="tab-panel">
                <div class="complex-detail-toolbar">
                </div>

                <div class="complex-detail-content">
                    <div class="complex-detail-main">
                        <div id="apartmentsContainer" class="sections-grid"></div>
                    </div>
                </div>
            </section>

            <!-- Apartment Detail -->
            <section id="tab-apartment-detail" class="tab-panel">
                <div class="detail-grid">
                    <div class="detail-content">
                        <div class="panel" id="phoneBlock" style="display:none;">
                            <div class="phone-panel">
                                <label>Телефон</label>
                                <div class="phone-row">
                                    <input type="tel" id="phoneInput" class="input" placeholder="+7 (999) 123-45-67">
                                    <button class="btn btn-primary" onclick="savePhone()">Сохранить</button>
                                    <button class="btn btn-danger" onclick="deletePhone()">Удалить</button>
                                </div>
                            </div>
                        </div>
                        <div class="panel" id="commentBlock" style="display:none;">
                            <div class="phone-panel">
                                <label>Комментарий</label>
                                <div class="phone-row">
                                    <input type="text" id="complexCommentInput" class="input" placeholder="Причина повышенной сложности">
                                    <button class="btn btn-primary" onclick="saveComment()">Сохранить</button>
                                </div>
                            </div>
                        </div>

                        <div class="panel">
                            <div class="panel-header">
                                <span class="panel-title">Замечания</span>
                                <button class="btn btn-sm" onclick="printDefects()">Печать</button>
                            </div>
                            <div id="defectsList"></div>
                        </div>
                    </div>

                    <div class="detail-main">
                </div>
            </section>

            <!-- Add Defect -->
            <section id="tab-add-defect" class="tab-panel">
                <form id="addDefectForm" class="form">
                    <div class="form-field">
                        <label>Категория</label>
                        <select id="defectCategory" required><option value="">Выберите</option></select>
                    </div>
                    <div class="form-field" id="windowGroup" style="display:none;">
                        <label>Номер окна</label>
                        <input type="number" id="windowNumber" min="1">
                    </div>
                    <div class="form-field" id="templatesGroup" style="display:none;">
                        <label>Шаблоны</label>
                        <div id="templatesList" class="chips"></div>
                    </div>
                    <div class="form-field">
                        <label>Описание</label>
                        <textarea id="defectDescription" rows="4" required></textarea>
                    </div>
                    <div class="form-field">
                        <label>Срок</label>
                        <input type="date" id="defectDeadline">
                    </div>
                    <div class="form-field">
                        <label>Фото</label>
                        <div class="upload-zone" id="fileUploadArea">
                            <input type="file" id="defectPhotos" multiple accept="image/*" hidden>
                            Перетащите фото или нажмите для выбора
                        </div>
                        <div id="previewGrid" class="previews"></div>
                    </div>
                    <div class="form-footer">
                        <button type="button" class="btn" onclick="backToApartment()">Отмена</button>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <div id="photoModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <img id="modalImg" src="" alt="">
        </div>
    </div>

    <div id="commentsModal" class="modal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3>Комментарии</h3>
                <button class="modal-close" onclick="closeComments()">×</button>
            </div>
            <div class="modal-body" id="commentsBody"></div>
            <div class="modal-footer">
                <input type="text" id="commentInput" placeholder="Комментарий...">
                <button class="btn btn-primary btn-sm" onclick="submitComment()">→</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
</body>
</html>
